name: Verify release build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.2'
          cache: false
      - name: Install build tools
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.15.4
          go install github.com/anchore/syft/cmd/syft@v1.54.1
      - run: go test -mod=vendor -race ./...
      - run: goreleaser release --snapshot --clean --skip=publish,sign
      - run: python3 scripts/release-assets.py
      # Build validation only. Distribution files are checked and signed in the
      # maintainer's release environment before they are uploaded separately.
      # No artifact upload, release creation, registry push or signing credentials.
